<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dilution Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: grid; place-items: center;
      background: #f4f6f9; color: #182230;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 430px); padding: 26px;
      background: #fff; border: 1px solid #e0e5ec;
      border-radius: 16px; box-shadow: 0 8px 28px #1822300d;
    }

    label {
      display: block; margin: 0 0 7px;
      font-size: .95rem; font-weight: 650;
    }

    input, select {
      width: 100%; min-width: 0; padding: 13px 14px;
      border: 1px solid #cbd5e1; border-radius: 10px;
      background: #fff; color: inherit; font: inherit;
    }

    input:focus, select:focus {
      outline: 3px solid #dce7ff; border-color: #315bd6;
    }

    .field { margin-bottom: 20px; }

    .amount-row {
      display: grid; grid-template-columns: 1fr 100px; gap: 9px;
    }

    .ratio-row {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px;
    }

    .colon {
      font-weight: 700; font-size: 1.2rem; color: #64748b;
    }

    .results {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-top: 25px;
    }

    .result {
      min-width: 0; padding: 16px; border-radius: 12px;
      background: #f7f9fc; border: 1px solid #e0e5ec;
    }

    .result-label {
      color: #64748b; font-size: .9rem; font-weight: 650;
    }

    .value {
      margin-top: 7px;
      font-size: clamp(1.2rem, 5vw, 1.65rem);
      font-weight: 750; overflow-wrap: anywhere;
    }

    .unit {
      margin-top: 2px; color: #64748b; font-size: .85rem;
    }

    .error {
      min-height: 1.2em; margin-top: 10px;
      color: #b42318; font-size: .88rem;
    }

    @media (max-width: 380px) {
      main { padding: 19px; }
      .results { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <div class="field">
      <label for="total">Total amount</label>
      <div class="amount-row">
        <input id="total" type="number" min="0" step="any" value="10000" inputmode="decimal">
        <select id="unit" aria-label="Starting amount unit">
          <option value="µL">µL</option>
          <option value="mL">mL</option>
          <option value="nL">nL</option>
          <option value="pL">pL</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="ratio">Dilution ratio</label>
      <div class="ratio-row">
        <input aria-label="First ratio number" value="1" disabled>
        <span class="colon">:</span>
        <input id="ratio" type="number" min="1" step="any" value="400" inputmode="decimal">
      </div>
    </div>

    <section class="results" aria-live="polite">
      <div class="result">
        <div class="result-label">Antibody</div>
        <div class="value" id="antibody">25</div>
        <div class="unit">µL</div>
      </div>
      <div class="result">
        <div class="result-label">Diluent</div>
        <div class="value" id="diluent">9,975</div>
        <div class="unit">µL</div>
      </div>
    </section>

    <div class="error" id="error" role="alert"></div>
  </main>

  <script>
    const totalInput = document.getElementById('total');
    const ratioInput = document.getElementById('ratio');
    const unitInput = document.getElementById('unit');
    const antibodyOutput = document.getElementById('antibody');
    const diluentOutput = document.getElementById('diluent');
    const error = document.getElementById('error');

    const conversions = {
      'µL': 1,
      'mL': 1000,
      'nL': 0.001,
      'pL': 0.000001
    };

    function format(value) {
      return Math.round(value).toLocaleString();
    }

    function calculate() {
      const totalText = totalInput.value.trim();
      const ratioText = ratioInput.value.trim();
      const total = Number(totalText);
      const ratio = Number(ratioText);

      if (
        totalText === '' ||
        ratioText === '' ||
        !Number.isFinite(total) ||
        !Number.isFinite(ratio) ||
        total <= 0 ||
        ratio < 1
      ) {
        antibodyOutput.textContent = '—';
        diluentOutput.textContent = '—';
        error.textContent = 'Enter a total greater than 0 and a ratio of at least 1.';
        return;
      }

      const totalInMicrolitres = total * conversions[unitInput.value];

      // A 1:N dilution means 1 part antibody in N parts total.
      const antibody = Math.round(totalInMicrolitres / ratio);
      const diluent = Math.round(totalInMicrolitres) - antibody;

      antibodyOutput.textContent = format(antibody);
      diluentOutput.textContent = format(diluent);
      error.textContent = '';
    }

    totalInput.addEventListener('input', calculate);
    ratioInput.addEventListener('input', calculate);
    unitInput.addEventListener('change', calculate);

    calculate();
  </script>
</body>
</html>
